name: phpunit
on:
  push:
  pull_request:
  
jobs:
  test-host:
    runs-on: ubuntu-latest
    
    strategy:
       matrix:                                                                                                                                                                                                                              
         # v5.0 Supporta SOLO PHP 8.1+                                                                                                                                                                                                      
         php-version: [ '8.1', '8.2', '8.3', '8.4' ]                                                                                                                                                                                        
         mysql-version: [ '8.0', '8.4' ] # Testiamo su MySQL 8.0 (LTS) e 8.4 (Latest)                                                                                                                                                       
         include:                                                                                                                                                                                                                           
           # Code Coverage SOLO su una combinazione (più veloce: PHP 8.3 + MySQL 8.0)                                                                                                                                                       
           - php-version: '8.3'                                                                                                                                                                                                             
             mysql-version: '8.0'                                                                                                                                                                                                           
             coverage: true
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout
      uses: actions/checkout@v3       
    
    - name: Verify MySQL connection from host
      run: |
        sudo apt-get install -y mysql-client
        mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "SHOW DATABASES"

    - name: Import MySQL test DB
      run: |
        mysql --host 127.0.0.1 --port 3306 -uroot -proot < ./tests/db.sql
        
    - name: Compose setup
      run: |
        composer validate
        # composer check-platform-reqs
        # if a package requires php: ^7, then the option --ignore-platform-req=php+ would allow installing on PHP8
        composer install --no-interaction --ignore-platform-req=php+
        
    - name: Test the code
      run: |
        ./vendor/bin/phpunit --testdox tests       

  code-coverage:
    name: 'Code Coverage - PHP ${{ matrix.php-version }}'

    runs-on: 'ubuntu-latest'

    strategy:
        fail-fast: false
        matrix:
            php-version:
                - '7.4'

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3                
                
    steps:
        -   name: 'Checkout code'
            uses: actions/checkout@v2

        -   name: Verify MySQL connection from host
            run: |
                sudo apt-get install -y mysql-client
                mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "SHOW DATABASES"

        -   name: Import MySQL test DB
            run: |
                mysql --host 127.0.0.1 --port 3306 -uroot -proot < ./tests/db.sql
        
        -   name: 'Setup PHP'
            uses: shivammathur/setup-php@v2
            with:
                coverage: 'none'
                extensions: 'json'
                php-version: '${{ matrix.php-version }}'

        -   name: 'Display PHP versions'
            run: |
                php -r 'foreach (get_loaded_extensions() as $extension) echo $extension . " " . phpversion($extension) . PHP_EOL;'
                php -i
        -   name: 'Install Composer dependencies'
            uses: ramsey/composer-install@v1
            with:
                composer-options: '--prefer-dist'

        -   name: 'Display dependencies versions'
            run: composer show

        -   name: 'Run tests with coverage'
            run: phpdbg -qrr vendor/bin/phpunit --coverage-clover coverage/clover.xml

        -   name: 'Send Coverage'
            continue-on-error: true
            timeout-minutes: 1
            run: |
                wget https://scrutinizer-ci.com/ocular.phar
                php ocular.phar code-coverage:upload --format=php-clover coverage/clover.xml          
