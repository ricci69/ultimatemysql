build:
    image: default-jammy
    environment:
        php: 8.3

    nodes:
        analysis:
            project_setup:
                override:
                    - 'true'

            tests:
                override:
                    - php-scrutinizer-run
                    -
                        command: phpcs-run
                        use_website_config: true

filter:
    excluded_paths:
        - 'tests/*'

checks:
    php: true

tools:
    external_code_coverage: true
